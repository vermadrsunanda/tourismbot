<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tourism Bot - AI Travel Assistant</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            height: 90vh;
            max-height: 700px;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
            border-radius: 12px 12px 0 0;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 30px;
            background: #f8f9fa;
        }

        .message {
            margin-bottom: 20px;
            display: flex;
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            justify-content: flex-end;
        }

        .message-content {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 12px;
            word-wrap: break-word;
            line-height: 1.4;
        }

        .user .message-content {
            background: #667eea;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .bot .message-content {
            background: white;
            color: #333;
            border: 1px solid #e0e0e0;
            border-bottom-left-radius: 4px;
        }

        .input-area {
            padding: 20px;
            background: white;
            border-top: 1px solid #e0e0e0;
            border-radius: 0 0 12px 12px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        #messageInput {
            flex: 1;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
        }

        #messageInput:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        button {
            padding: 12px 24px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: background 0.3s;
        }

        button:hover:not(:disabled) {
            background: #5568d3;
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .suggestion-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .suggestion-btn {
            padding: 8px 16px;
            background: #f0f0f0;
            color: #333;
            border: 1px solid #ddd;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.3s;
        }

        .suggestion-btn:hover {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 12px 16px;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            background: #667eea;
            border-radius: 50%;
            animation: typing 1.4s infinite;
        }

        .typing-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%, 60%, 100% {
                opacity: 0.5;
                transform: translateY(0);
            }
            30% {
                opacity: 1;
                transform: translateY(-10px);
            }
        }

        .error-message {
            color: #d32f2f;
            padding: 10px;
            background: #ffebee;
            border-radius: 6px;
            font-size: 13px;
            margin-bottom: 10px;
        }

        .voice-button {
            padding: 12px 16px;
            background: #ff6b6b;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .voice-button:hover {
            background: #ff5252;
        }

        .voice-button.listening {
            background: #4caf50;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.7;
            }
        }

        .info-section {
            margin-top: 15px;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 8px;
            font-size: 13px;
        }

        .info-section h4 {
            margin-bottom: 8px;
            color: #333;
        }

        .weather-info, .flight-info {
            padding: 10px;
            background: white;
            border-left: 4px solid #667eea;
            border-radius: 4px;
            margin-bottom: 10px;
            font-size: 12px;
        }

        .weather-info strong, .flight-info strong {
            color: #667eea;
        }

        @media (max-width: 600px) {
            .container {
                height: 100vh;
                max-height: none;
            }

            .message-content {
                max-width: 85%;
            }

            .header h1 {
                font-size: 22px;
            }

            .voice-button {
                font-size: 12px;
                padding: 10px 12px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌍 Tourism Bot</h1>
            <p>Your AI-powered travel assistant powered by Mistral AI</p>
        </div>

        <div class="chat-container" id="chatContainer">
            <div class="message bot">
                <div class="message-content">
                    Welcome to Tourism Bot! 🎉 I'm here to help you explore the world. Ask me about destinations, travel tips, or local attractions. Where would you like to travel?
                </div>
            </div>
        </div>

        <div class="input-area">
            <div id="errorMessage" class="error-message" style="display: none;"></div>
            
            <div class="suggestion-buttons" id="suggestions">
                <button class="suggestion-btn" onclick="sendMessage('Tell me about popular beach destinations')">🏖️ Beach Destinations</button>
                <button class="suggestion-btn" onclick="sendMessage('I love hiking and nature, where should I go?')">🏔️ Mountain Hiking</button>
                <button class="suggestion-btn" onclick="sendMessage('What are the best cities for food tourism?')">🍽️ Food Tourism</button>
                <button class="suggestion-btn" onclick="sendMessage('Recommend a budget-friendly destination for backpackers')">💰 Budget Travel</button>
            </div>

            <div class="input-group">
                <input 
                    type="text" 
                    id="messageInput" 
                    placeholder="Ask me about travel destinations, tips, or attractions..." 
                    autocomplete="off"
                >
                <button id="sendBtn" onclick="sendMessage()">Send</button>
                <button id="voiceBtn" class="voice-button" onclick="toggleVoiceInput()" title="Click to start voice input">🎤 Voice</button>
            </div>

            <div id="weatherFlightInfo">
                <div id="weatherInfo" style="display: none;"></div>
                <div id="flightInfo" style="display: none;"></div>
            </div>
        </div>
    </div>

    <script>
        const chatContainer = document.getElementById('chatContainer');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const voiceBtn = document.getElementById('voiceBtn');
        const errorMessage = document.getElementById('errorMessage');

        // Voice Recognition Setup
        let isListening = false;
        let recognition;
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        
        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = true;
            recognition.lang = 'en-US';

            recognition.onstart = () => {
                isListening = true;
                voiceBtn.classList.add('listening');
                voiceBtn.textContent = '🎤 Listening...';
            };

            recognition.onresult = (event) => {
                let interimTranscript = '';
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    const transcript = event.results[i][0].transcript;
                    if (event.results[i].isFinal) {
                        messageInput.value = transcript;
                    } else {
                        interimTranscript += transcript;
                    }
                }
            };

            recognition.onerror = (event) => {
                showError(`Voice error: ${event.error}`);
                voiceBtn.classList.remove('listening');
                voiceBtn.textContent = '🎤 Voice';
                isListening = false;
            };

            recognition.onend = () => {
                isListening = false;
                voiceBtn.classList.remove('listening');
                voiceBtn.textContent = '🎤 Voice';
                if (messageInput.value.trim()) {
                    sendMessage();
                }
            };
        } else {
            voiceBtn.disabled = true;
            voiceBtn.title = 'Voice recognition not supported in this browser';
        }

        function toggleVoiceInput() {
            if (!SpeechRecognition) {
                showError('Voice recognition not supported. Please use Chrome, Firefox, or Edge.');
                return;
            }

            if (isListening) {
                recognition.stop();
            } else {
                messageInput.value = '';
                recognition.start();
            }
        }

        // Text-to-Speech
        function speakResponse(text) {
            if (!('speechSynthesis' in window)) {
                console.log('Text-to-speech not supported');
                return;
            }
            
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = 0.9;
            utterance.pitch = 1.0;
            utterance.volume = 1.0;
            speechSynthesis.speak(utterance);
        }

        // Focus on input when page loads
        messageInput.focus();

        // Send message on Enter key
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.style.display = 'block';
            setTimeout(() => {
                errorMessage.style.display = 'none';
            }, 5000);
        }

        function addMessage(content, isUser = false) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user' : 'bot'}`;
            
            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            contentDiv.textContent = content;
            
            messageDiv.appendChild(contentDiv);
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function showTypingIndicator() {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message bot';
            messageDiv.id = 'typingIndicator';
            
            const indicatorDiv = document.createElement('div');
            indicatorDiv.className = 'typing-indicator';
            
            for (let i = 0; i < 3; i++) {
                const dot = document.createElement('div');
                dot.className = 'typing-dot';
                indicatorDiv.appendChild(dot);
            }
            
            messageDiv.appendChild(indicatorDiv);
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function removeTypingIndicator() {
            const indicator = document.getElementById('typingIndicator');
            if (indicator) {
                indicator.remove();
            }
        }

        // Fetch weather data
        async function fetchWeatherData(destination) {
            try {
                const response = await fetch(`/api/weather?destination=${encodeURIComponent(destination)}`);
                if (!response.ok) return null;
                const data = await response.json();
                displayWeatherInfo(data);
                return data;
            } catch (error) {
                console.log('Weather data not available');
                return null;
            }
        }

        function displayWeatherInfo(data) {
            const weatherDiv = document.getElementById('weatherInfo');
            if (data && data.success) {
                weatherDiv.innerHTML = `
                    <div class="info-section">
                        <h4>🌤️ Weather for ${data.destination}</h4>
                        <div class="weather-info">
                            <strong>Temperature:</strong> ${data.temperature}°C<br>
                            <strong>Condition:</strong> ${data.description}<br>
                            <strong>Humidity:</strong> ${data.humidity}%
                        </div>
                    </div>
                `;
                weatherDiv.style.display = 'block';
            }
        }

        // Fetch flight data
        async function fetchFlightData(origin, destination) {
            try {
                const response = await fetch(`/api/flights?origin=${encodeURIComponent(origin)}&destination=${encodeURIComponent(destination)}`);
                if (!response.ok) return null;
                const data = await response.json();
                displayFlightInfo(data);
                return data;
            } catch (error) {
                console.log('Flight data not available');
                return null;
            }
        }

        function displayFlightInfo(data) {
            const flightDiv = document.getElementById('flightInfo');
            if (data && data.success && data.flights && data.flights.length > 0) {
                let flightHTML = `
                    <div class="info-section">
                        <h4>✈️ Available Flights</h4>
                `;
                
                data.flights.slice(0, 3).forEach(flight => {
                    flightHTML += `
                        <div class="flight-info">
                            <strong>${flight.airline}</strong> - $${flight.price}<br>
                            ${flight.departure} → ${flight.arrival}
                        </div>
                    `;
                });
                
                flightHTML += '</div>';
                flightDiv.innerHTML = flightHTML;
                flightDiv.style.display = 'block';
            }
        }

        async function sendMessage(message = null) {
            const userMessage = message || messageInput.value.trim();
            
            if (!userMessage) {
                showError('Please enter a message');
                return;
            }

            // Disable input and button
            messageInput.disabled = true;
            sendBtn.disabled = true;
            voiceBtn.disabled = true;
            
            // Add user message to chat
            addMessage(userMessage, true);
            messageInput.value = '';
            
            // Show typing indicator
            showTypingIndicator();

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ message: userMessage })
                });

                const data = await response.json();
                removeTypingIndicator();

                if (!response.ok) {
                    throw new Error(data.error || 'Error communicating with the bot');
                }

                // Add bot response
                addMessage(data.response, false);
                
                // Play response as voice
                speakResponse(data.response);

                // Extract destination from user message for weather/flight data
                if (userMessage.toLowerCase().includes('weather') || 
                    userMessage.toLowerCase().includes('flight') ||
                    userMessage.toLowerCase().includes('destination') ||
                    userMessage.toLowerCase().includes('travel to')) {
                    
                    // Simple extraction of destination
                    const words = userMessage.split(' ');
                    const toIndex = words.findIndex(w => w.toLowerCase() === 'to');
                    if (toIndex !== -1 && toIndex < words.length - 1) {
                        const destination = words.slice(toIndex + 1).join(' ');
                        setTimeout(() => {
                            fetchWeatherData(destination);
                            fetchFlightData('NYC', destination); // Default origin
                        }, 1000);
                    }
                }

            } catch (error) {
                removeTypingIndicator();
                showError(error.message || 'Failed to get response from the bot. Please try again.');
                console.error('Error:', error);
            } finally {
                // Re-enable input and button
                messageInput.disabled = false;
                sendBtn.disabled = false;
                voiceBtn.disabled = false;
                messageInput.focus();
            }
        }
    </script>
</body>
</html>
